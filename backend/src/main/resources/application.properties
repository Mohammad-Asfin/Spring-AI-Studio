spring.application.name=springai-studio

# Server Port
server.port=8080

# Spring AI API Keys (Read from environment variables, fallback to dummy to allow context load)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:dummy-openai-key}
spring.ai.anthropic.api-key=${SPRING_AI_ANTHROPIC_API_KEY:dummy-anthropic-key}

# Ollama Configuration
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${SPRING_AI_OLLAMA_MODEL:deepseek-r1:14b}